[versions]
agp = "8.13.2"
coreKtx = "1.18.0"
credentialsPlayServicesAuth = "1.5.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
